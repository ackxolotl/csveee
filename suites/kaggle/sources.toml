# Kaggle CSV corpus: 1000 files sampled log-uniformly by size.
#
# Produced once from the evaluation repo's sampled_files.json
# (csveee-evaluation/scripts/kaggle_uniform_sample.py); the generator was a
# one-off and is not kept, so this file is now maintained by hand. It is the
# download list, not the dialect record — dialects live in manifest.toml
# (sniffed) and overrides.toml (hand-written).
#
# `size` is the size Kaggle reported at sampling time. It picks the tier
# (provision_data.py --tier), guards free space before a download, and catches a
# truncated one afterwards.
#
# Keys are the dataset and the path within it, flattened on "_" exactly as the
# scraped suites flatten upstream paths. They are the filename under the data
# root and the manifest key the test harness uses.

